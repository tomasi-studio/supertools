name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    env:
      VERSION: ${{ inputs.version }}
      TARBALL: supertools-${{ inputs.version }}-arm64.tar.gz
    steps:
      - uses: actions/checkout@v4

      - name: Install c3c
        run: brew install c3c

      # lib/ is gitignored; fetch the dependencies listed in project.json into it
      - name: Fetch dependencies
        run: |
          mkdir -p lib
          cd lib
          ruby -rjson -e 'puts JSON.parse(File.read("../project.json"))["dependencies"]' |
            while read -r dep; do c3c fetch "$dep"; done

      - name: Build
        run: c3c build supertools

      - name: Package
        run: |
          tar -C out -czf "$TARBALL" supertools
          echo "SHA256=$(shasum -a 256 "$TARBALL" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" "$TARBALL" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "supertools $VERSION" --notes "supertools $VERSION (macOS arm64)"

      - name: Update Homebrew tap
        env:
          GH_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          gh repo clone tomasi-studio/homebrew-apps tap
          cd tap
          sed -i '' \
            -e "s|^  version \".*\"|  version \"$VERSION\"|" \
            -e "s|^  sha256 \".*\"|  sha256 \"$SHA256\"|" \
            Formula/supertools.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "supertools $VERSION"
          git push "https://x-access-token:$GH_TOKEN@github.com/tomasi-studio/homebrew-apps.git" HEAD
